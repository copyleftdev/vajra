<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <!-- Etching gradient for metallic depth -->
    <linearGradient id="etch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4a35a"/>
      <stop offset="50%" stop-color="#e8d5a3"/>
      <stop offset="100%" stop-color="#8b7332"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1f0a"/>
      <stop offset="100%" stop-color="#1a1205"/>
    </linearGradient>
    <linearGradient id="prong-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b86a"/>
      <stop offset="40%" stop-color="#f0e0b0"/>
      <stop offset="100%" stop-color="#a08030"/>
    </linearGradient>
    <!-- Fine etching pattern -->
    <pattern id="etch-lines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="4" x2="4" y2="0" stroke="#5a4820" stroke-width="0.3" opacity="0.4"/>
    </pattern>
    <!-- Glow filter for the central orb -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="deep-etch">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="#0d0a06"/>

  <!-- === UPPER PRONG ASSEMBLY === -->
  <!-- Five prongs curving inward to central point -->
  <g transform="translate(200, 80)" filter="url(#deep-etch)">
    <!-- Central prong (tallest) -->
    <path d="M0,-75 C-3,-60 -4,-30 -5,0 L5,0 C4,-30 3,-60 0,-75Z" fill="url(#prong-grad)" stroke="#6b5a2a" stroke-width="0.8"/>
    <!-- Diamond tip -->
    <path d="M0,-80 L-4,-72 L0,-75 L4,-72Z" fill="#f0e0b0" stroke="#8b7332" stroke-width="0.5"/>
    <!-- Etching on central prong -->
    <line x1="0" y1="-70" x2="0" y2="-10" stroke="#6b5a2a" stroke-width="0.4" opacity="0.6"/>
    <circle cx="0" cy="-55" r="1.5" fill="none" stroke="#8b7332" stroke-width="0.4"/>
    <circle cx="0" cy="-40" r="1" fill="none" stroke="#8b7332" stroke-width="0.4"/>
    <circle cx="0" cy="-25" r="1.5" fill="none" stroke="#8b7332" stroke-width="0.4"/>

    <!-- Inner left prong -->
    <path d="M-8,-55 C-10,-40 -9,-20 -4,2 L-2,-2 C-6,-20 -6,-38 -5,-55Z" fill="url(#prong-grad)" stroke="#6b5a2a" stroke-width="0.7"/>
    <path d="M-8,-60 L-10,-52 L-7,-55 L-5,-52Z" fill="#f0e0b0" stroke="#8b7332" stroke-width="0.4"/>
    <!-- Etching: flowing lines -->
    <path d="M-7,-50 C-7,-35 -6,-20 -3,0" fill="none" stroke="#6b5a2a" stroke-width="0.3" opacity="0.5"/>

    <!-- Inner right prong -->
    <path d="M8,-55 C10,-40 9,-20 4,2 L2,-2 C6,-20 6,-38 5,-55Z" fill="url(#prong-grad)" stroke="#6b5a2a" stroke-width="0.7"/>
    <path d="M8,-60 L10,-52 L7,-55 L5,-52Z" fill="#f0e0b0" stroke="#8b7332" stroke-width="0.4"/>
    <path d="M7,-50 C7,-35 6,-20 3,0" fill="none" stroke="#6b5a2a" stroke-width="0.3" opacity="0.5"/>

    <!-- Outer left prong -->
    <path d="M-16,-40 C-20,-28 -16,-12 -6,5 L-5,0 C-12,-12 -15,-26 -13,-40Z" fill="url(#prong-grad)" stroke="#6b5a2a" stroke-width="0.7"/>
    <path d="M-17,-45 L-20,-37 L-15,-40 L-12,-38Z" fill="#f0e0b0" stroke="#8b7332" stroke-width="0.4"/>

    <!-- Outer right prong -->
    <path d="M16,-40 C20,-28 16,-12 6,5 L5,0 C12,-12 15,-26 13,-40Z" fill="url(#prong-grad)" stroke="#6b5a2a" stroke-width="0.7"/>
    <path d="M17,-45 L20,-37 L15,-40 L12,-38Z" fill="#f0e0b0" stroke="#8b7332" stroke-width="0.4"/>

    <!-- Crown ring at prong base -->
    <ellipse cx="0" cy="5" rx="22" ry="6" fill="none" stroke="#c4a35a" stroke-width="1.2"/>
    <ellipse cx="0" cy="5" rx="18" ry="4.5" fill="none" stroke="#8b7332" stroke-width="0.5"/>
  </g>

  <!-- === UPPER LOTUS === -->
  <g transform="translate(200, 100)">
    <!-- Lotus petals opening upward -->
    <path d="M-25,12 C-22,0 -12,-8 0,-10 C12,-8 22,0 25,12" fill="none" stroke="#c4a35a" stroke-width="1"/>
    <path d="M-20,12 C-17,3 -9,-3 0,-5 C9,-3 17,3 20,12" fill="none" stroke="#a08030" stroke-width="0.7"/>
    <!-- Petal details -->
    <path d="M-15,10 C-12,5 -6,1 0,0" fill="none" stroke="#6b5a2a" stroke-width="0.4"/>
    <path d="M15,10 C12,5 6,1 0,0" fill="none" stroke="#6b5a2a" stroke-width="0.4"/>
    <!-- Ornamental band -->
    <rect x="-25" y="12" width="50" height="3" rx="1" fill="url(#etch)" stroke="#6b5a2a" stroke-width="0.5"/>
    <!-- Tiny etched dots along band -->
    <circle cx="-18" cy="13.5" r="0.6" fill="#6b5a2a"/>
    <circle cx="-12" cy="13.5" r="0.6" fill="#6b5a2a"/>
    <circle cx="-6" cy="13.5" r="0.6" fill="#6b5a2a"/>
    <circle cx="0" cy="13.5" r="0.6" fill="#6b5a2a"/>
    <circle cx="6" cy="13.5" r="0.6" fill="#6b5a2a"/>
    <circle cx="12" cy="13.5" r="0.6" fill="#6b5a2a"/>
    <circle cx="18" cy="13.5" r="0.6" fill="#6b5a2a"/>
  </g>

  <!-- === CENTRAL SHAFT — THE GRIP === -->
  <g transform="translate(200, 118)">
    <!-- Main shaft body -->
    <rect x="-18" y="0" width="36" height="160" rx="3" fill="url(#etch)" stroke="#6b5a2a" stroke-width="1"/>
    <!-- Overlay hatching -->
    <rect x="-18" y="0" width="36" height="160" rx="3" fill="url(#etch-lines)" opacity="0.3"/>

    <!-- Ornamental bands with lore etchings -->
    <!-- Band 1 — top -->
    <rect x="-20" y="5" width="40" height="6" rx="1" fill="#a08030" stroke="#6b5a2a" stroke-width="0.6"/>
    <!-- JSON brace motif etched into band -->
    <text x="-12" y="10" font-family="monospace" font-size="5" fill="#3a2e15" opacity="0.7">{ } [ ] { }</text>

    <!-- Band 2 — interlocking knotwork -->
    <rect x="-20" y="20" width="40" height="8" rx="1" fill="#b89840" stroke="#6b5a2a" stroke-width="0.6"/>
    <!-- Celtic-style interlace etching -->
    <path d="M-15,24 C-10,21 -5,27 0,24 C5,21 10,27 15,24" fill="none" stroke="#3a2e15" stroke-width="0.8"/>
    <path d="M-15,26 C-10,23 -5,29 0,26 C5,23 10,29 15,26" fill="none" stroke="#3a2e15" stroke-width="0.5" opacity="0.5"/>

    <!-- Band 3 — Tree/graph motif (JSON as tree) -->
    <rect x="-20" y="35" width="40" height="12" rx="1" fill="#a08030" stroke="#6b5a2a" stroke-width="0.6"/>
    <!-- Miniature tree etching -->
    <line x1="0" y1="37" x2="0" y2="45" stroke="#3a2e15" stroke-width="0.6"/>
    <line x1="0" y1="39" x2="-8" y2="43" stroke="#3a2e15" stroke-width="0.5"/>
    <line x1="0" y1="39" x2="8" y2="43" stroke="#3a2e15" stroke-width="0.5"/>
    <line x1="-8" y1="43" x2="-12" y2="45" stroke="#3a2e15" stroke-width="0.4"/>
    <line x1="-8" y1="43" x2="-5" y2="45" stroke="#3a2e15" stroke-width="0.4"/>
    <line x1="8" y1="43" x2="5" y2="45" stroke="#3a2e15" stroke-width="0.4"/>
    <line x1="8" y1="43" x2="12" y2="45" stroke="#3a2e15" stroke-width="0.4"/>
    <!-- Small nodes -->
    <circle cx="0" cy="39" r="1" fill="#c4a35a" stroke="#3a2e15" stroke-width="0.3"/>
    <circle cx="-8" cy="43" r="0.8" fill="#c4a35a" stroke="#3a2e15" stroke-width="0.3"/>
    <circle cx="8" cy="43" r="0.8" fill="#c4a35a" stroke="#3a2e15" stroke-width="0.3"/>

    <!-- === THE NAME — VAJRA etched into the shaft === -->
    <rect x="-20" y="55" width="40" height="50" rx="2" fill="#8b7332" stroke="#5a4820" stroke-width="1"/>
    <!-- Deep etched border -->
    <rect x="-17" y="58" width="34" height="44" rx="1" fill="none" stroke="#c4a35a" stroke-width="0.6"/>
    <rect x="-15" y="60" width="30" height="40" rx="1" fill="none" stroke="#6b5a2a" stroke-width="0.3"/>

    <!-- V -->
    <path d="M-12,66 L-9,84 L-6,66" fill="none" stroke="#e8d5a3" stroke-width="2" stroke-linecap="round"/>
    <!-- A -->
    <path d="M-4,84 L-1,66 L2,84 M-3,77 L1,77" fill="none" stroke="#e8d5a3" stroke-width="2" stroke-linecap="round"/>
    <!-- J -->
    <path d="M4,66 L4,80 C4,84 2,85 0,84" fill="none" stroke="#e8d5a3" stroke-width="2" stroke-linecap="round"/>
    <!-- R -->
    <path d="M7,84 L7,66 L11,66 C13,66 14,69 12,71 L7,71 L14,84" fill="none" stroke="#e8d5a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- A -->
    <path d="M13,84 L16,66 L19,84 M14,77 L18,77" fill="none" stroke="#e8d5a3" stroke-width="2" stroke-linecap="round"/>

    <!-- Ornamental corners around name -->
    <path d="M-16,59 L-16,63 M-16,59 L-12,59" fill="none" stroke="#c4a35a" stroke-width="0.8"/>
    <path d="M16,59 L16,63 M16,59 L12,59" fill="none" stroke="#c4a35a" stroke-width="0.8"/>
    <path d="M-16,101 L-16,97 M-16,101 L-12,101" fill="none" stroke="#c4a35a" stroke-width="0.8"/>
    <path d="M16,101 L16,97 M16,101 L12,101" fill="none" stroke="#c4a35a" stroke-width="0.8"/>

    <!-- Band 5 — Wave/signal motif (entropy/distribution) -->
    <rect x="-20" y="112" width="40" height="10" rx="1" fill="#a08030" stroke="#6b5a2a" stroke-width="0.6"/>
    <!-- Signal wave etching -->
    <path d="M-15,117 C-12,113 -9,121 -6,117 C-3,113 0,121 3,117 C6,113 9,121 12,117 C15,113" fill="none" stroke="#3a2e15" stroke-width="0.7"/>

    <!-- Band 6 — Diamond chain (fingerprint/hash motif) -->
    <rect x="-20" y="128" width="40" height="8" rx="1" fill="#b89840" stroke="#6b5a2a" stroke-width="0.6"/>
    <!-- Chain of diamonds -->
    <path d="M-14,132 L-11,129 L-8,132 L-11,135Z" fill="none" stroke="#3a2e15" stroke-width="0.5"/>
    <path d="M-6,132 L-3,129 L0,132 L-3,135Z" fill="none" stroke="#3a2e15" stroke-width="0.5"/>
    <path d="M2,132 L5,129 L8,132 L5,135Z" fill="none" stroke="#3a2e15" stroke-width="0.5"/>
    <path d="M10,132 L13,129 L16,132 L13,135Z" fill="none" stroke="#3a2e15" stroke-width="0.5"/>
    <!-- Connecting lines -->
    <line x1="-8" y1="132" x2="-6" y2="132" stroke="#3a2e15" stroke-width="0.4"/>
    <line x1="0" y1="132" x2="2" y2="132" stroke="#3a2e15" stroke-width="0.4"/>
    <line x1="8" y1="132" x2="10" y2="132" stroke="#3a2e15" stroke-width="0.4"/>

    <!-- Band 7 — bottom -->
    <rect x="-20" y="148" width="40" height="6" rx="1" fill="#a08030" stroke="#6b5a2a" stroke-width="0.6"/>
    <text x="-12" y="153" font-family="monospace" font-size="5" fill="#3a2e15" opacity="0.7">$ . [ * ] .</text>
  </g>

  <!-- === CENTRAL ORB (BINDU) === -->
  <g transform="translate(200, 300)" filter="url(#glow)">
    <circle cx="0" cy="0" r="14" fill="#2a1f0a" stroke="#c4a35a" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="11" fill="none" stroke="#e8d5a3" stroke-width="0.6"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#c4a35a" stroke-width="0.4"/>
    <!-- Inner mandala pattern -->
    <path d="M0,-6 L5.2,3 L-5.2,3Z" fill="none" stroke="#e8d5a3" stroke-width="0.5"/>
    <path d="M0,6 L5.2,-3 L-5.2,-3Z" fill="none" stroke="#e8d5a3" stroke-width="0.5"/>
    <circle cx="0" cy="0" r="2" fill="#e8d5a3" opacity="0.8"/>
  </g>

  <!-- === LOWER LOTUS (mirror of upper) === -->
  <g transform="translate(200, 290)">
    <path d="M-25,188 C-22,200 -12,208 0,210 C12,208 22,200 25,188" fill="none" stroke="#c4a35a" stroke-width="1"/>
    <path d="M-20,188 C-17,197 -9,203 0,205 C9,203 17,197 20,188" fill="none" stroke="#a08030" stroke-width="0.7"/>
    <path d="M-15,190 C-12,195 -6,199 0,200" fill="none" stroke="#6b5a2a" stroke-width="0.4"/>
    <path d="M15,190 C12,195 6,199 0,200" fill="none" stroke="#6b5a2a" stroke-width="0.4"/>
    <rect x="-25" y="185" width="50" height="3" rx="1" fill="url(#etch)" stroke="#6b5a2a" stroke-width="0.5"/>
    <circle cx="-18" cy="186.5" r="0.6" fill="#6b5a2a"/>
    <circle cx="-12" cy="186.5" r="0.6" fill="#6b5a2a"/>
    <circle cx="-6" cy="186.5" r="0.6" fill="#6b5a2a"/>
    <circle cx="0" cy="186.5" r="0.6" fill="#6b5a2a"/>
    <circle cx="6" cy="186.5" r="0.6" fill="#6b5a2a"/>
    <circle cx="12" cy="186.5" r="0.6" fill="#6b5a2a"/>
    <circle cx="18" cy="186.5" r="0.6" fill="#6b5a2a"/>
  </g>

  <!-- === LOWER PRONG ASSEMBLY (mirror of upper) === -->
  <g transform="translate(200, 520) scale(1,-1)" filter="url(#deep-etch)">
    <path d="M0,-75 C-3,-60 -4,-30 -5,0 L5,0 C4,-30 3,-60 0,-75Z" fill="url(#prong-grad)" stroke="#6b5a2a" stroke-width="0.8"/>
    <path d="M0,-80 L-4,-72 L0,-75 L4,-72Z" fill="#f0e0b0" stroke="#8b7332" stroke-width="0.5"/>
    <line x1="0" y1="-70" x2="0" y2="-10" stroke="#6b5a2a" stroke-width="0.4" opacity="0.6"/>
    <circle cx="0" cy="-55" r="1.5" fill="none" stroke="#8b7332" stroke-width="0.4"/>
    <circle cx="0" cy="-40" r="1" fill="none" stroke="#8b7332" stroke-width="0.4"/>
    <circle cx="0" cy="-25" r="1.5" fill="none" stroke="#8b7332" stroke-width="0.4"/>

    <path d="M-8,-55 C-10,-40 -9,-20 -4,2 L-2,-2 C-6,-20 -6,-38 -5,-55Z" fill="url(#prong-grad)" stroke="#6b5a2a" stroke-width="0.7"/>
    <path d="M-8,-60 L-10,-52 L-7,-55 L-5,-52Z" fill="#f0e0b0" stroke="#8b7332" stroke-width="0.4"/>
    <path d="M8,-55 C10,-40 9,-20 4,2 L2,-2 C6,-20 6,-38 5,-55Z" fill="url(#prong-grad)" stroke="#6b5a2a" stroke-width="0.7"/>
    <path d="M8,-60 L10,-52 L7,-55 L5,-52Z" fill="#f0e0b0" stroke="#8b7332" stroke-width="0.4"/>

    <path d="M-16,-40 C-20,-28 -16,-12 -6,5 L-5,0 C-12,-12 -15,-26 -13,-40Z" fill="url(#prong-grad)" stroke="#6b5a2a" stroke-width="0.7"/>
    <path d="M-17,-45 L-20,-37 L-15,-40 L-12,-38Z" fill="#f0e0b0" stroke="#8b7332" stroke-width="0.4"/>
    <path d="M16,-40 C20,-28 16,-12 6,5 L5,0 C12,-12 15,-26 13,-40Z" fill="url(#prong-grad)" stroke="#6b5a2a" stroke-width="0.7"/>
    <path d="M17,-45 L20,-37 L15,-40 L12,-38Z" fill="#f0e0b0" stroke="#8b7332" stroke-width="0.4"/>

    <ellipse cx="0" cy="5" rx="22" ry="6" fill="none" stroke="#c4a35a" stroke-width="1.2"/>
    <ellipse cx="0" cy="5" rx="18" ry="4.5" fill="none" stroke="#8b7332" stroke-width="0.5"/>
  </g>

  <!-- === MANTRA TEXT === -->
  <text x="200" y="568" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6b5a2a" letter-spacing="6" opacity="0.7">BREAK NOISE</text>
  <text x="200" y="584" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c4a35a" letter-spacing="6">PRESERVE TRUTH</text>

  <!-- Subtle light effects on the weapon -->
  <line x1="200" y1="5" x2="200" y2="595" stroke="#e8d5a3" stroke-width="0.15" opacity="0.2"/>
</svg>
