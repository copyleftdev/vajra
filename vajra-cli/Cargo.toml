[package]
name = "vajra-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "vajra"
path = "src/main.rs"

[[bin]]
name = "generate-corpus"
path = "src/bin/generate_corpus.rs"

[dependencies]
vajra-types = { workspace = true }
vajra-core = { workspace = true }
vajra-fingerprint = { workspace = true }
vajra-stats = { workspace = true }
vajra-anomaly = { workspace = true }
vajra-drift = { workspace = true }
vajra-essence = { workspace = true }
vajra-domain-med = { workspace = true, optional = true }
vajra-domain-sec = { workspace = true, optional = true }
vajra-domain-devops = { workspace = true, optional = true }
vajra-domain-source = { workspace = true, optional = true }
vajra-domain-encoding = { workspace = true, optional = true }
vajra-source = { workspace = true, optional = true }
vajra-query = { workspace = true }
vajra-cascade = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
rayon = { workspace = true }

[features]
default = ["medical", "security", "devops", "source", "encoding"]
medical = ["vajra-domain-med"]
security = ["vajra-domain-sec"]
devops = ["vajra-domain-devops"]
source = ["vajra-source", "vajra-domain-source"]
encoding = ["vajra-domain-encoding"]
all-plugins = ["medical", "security", "devops", "source", "encoding"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
