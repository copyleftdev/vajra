[package]
name = "vajra-mcp"
version.workspace = true
edition.workspace = true
description = "MCP (Model Context Protocol) server for vajra"
license = "MIT OR Apache-2.0"

[[bin]]
name = "vajra-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
